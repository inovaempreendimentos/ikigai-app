function similarity(scores, v) {
  let dot = 0, a = 0, b = 0;
  for (const k of AXES) {
    const s = scores[k] || 0, w = v[k] || 0;
    dot += s * w; a += s * s; b += w * w;
  }
  if (a === 0 || b === 0) return 0;
  return dot / (Math.sqrt(a) * Math.sqrt(b));
}

/* ---------------------------------------------------------
   Sound (Tone.js) — optional, fails silently
--------------------------------------------------------- */
function useSound() {
  const synthRef = useRef(null);
  const readyRef = useRef(false);

  const ensure = useCallback(async () => {
    if (readyRef.current) return;
    try {
      await Tone.start();
      synthRef.current = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.001, decay: 0.15, sustain: 0, release: 0.1 } }).toDestination();
      readyRef.current = true;
    } catch (e) { /* silent */ }
  }, []);

  const tick = useCallback(() => {
    try { synthRef.current?.triggerAttackRelease("C6", "32n"); } catch (e) {}
  }, []);

  const chime = useCallback(() => {
    try {
      const synth = synthRef.current;
      if (!synth) return;
      const now = Tone.now();
      synth.triggerAttackRelease("E5", "16n", now);
      synth.triggerAttackRelease("G5", "16n", now + 0.1);
      synth.triggerAttackRelease("C6", "8n", now + 0.2);
    } catch (e) {}
  }, []);

  return { ensure, tick, chime };
}

/* ---------------------------------------------------------
   Ikigai diagram — four converging circles
--------------------------------------------------------- */
function IkigaiDiagram({ revealed, size = 220, showStamp = false, stampText = "" }) {
  const pos = [
    { top: "0%", left: "0%" },
    { top: "0%", left: "34%" },
    { top: "34%", left: "0%" },
    { top: "34%", left: "34%" },
  ];
  const dia = size * 0.66;
  return (
    <div style={{ position: "relative", width: size, height: size, margin: "0 auto" }}>
      {PILLARS.map((p, i) => (
        <div
          key={p.key}
          style={{
            position: "absolute",
            top: pos[i].top,
            left: pos[i].left,
            width: dia,
            height: dia,
            borderRadius: "9999px",
            background: p.color,
            opacity: 0.62,
            mixBlendMode: "multiply",
            transform: revealed[i] ? "scale(1)" : "scale(0)",
            transition: "transform 0.7s cubic-bezier(.34,1.56,.64,1)",
            transitionDelay: `${i * 0.08}s`,
          }}
        />
      ))}
      {showStamp && (
        <div
          style={{
            position: "absolute",
            inset: 0,
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            textAlign: "center",
            padding: "8%",
          }}
        >
          <div
            style={{
              fontFamily: "'Shippori Mincho', serif",
              color: "#F4EDDD",
              fontSize: size * 0.09,
              fontWeight: 700,
              lineHeight: 1.15,
              textShadow: "0 1px 4px rgba(0,0,0,0.5)",
              animation: "stampIn 0.5s cubic-bezier(.2,1.6,.4,1) 1.1s both",
            }}
          >
            {stampText}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Main App
--------------------------------------------------------- */
function IkigaiApp() {
  const [stage, setStage] = useState("intro"); // intro | quiz | interstitial | loading | result
  const [qIndex, setQIndex] = useState(0);
  const [answers, setAnswers] = useState(() => Array(QUESTIONS.length).fill(null)); // stores chosen option index per question
  const [justCompletedPillar, setJustCompletedPillar] = useState(null);
  const sound = useSound();

  const totalQ = QUESTIONS.length;
  const pillarOfIndex = (i) => Math.min(3, Math.floor(i / 4));
  const revealed = [0, 1, 2, 3].map(p => pillarOfIndex(qIndex) > p || (stage === "loading" || stage === "result"));

  const scores = useMemo(() => {
    const s = Object.fromEntries(AXES.map(a => [a, 0]));
    answers.forEach((optIdx, qi) => {
      if (optIdx == null) return;
      const w = QUESTIONS[qi].options[optIdx].w;
      for (const k of Object.keys(w)) s[k] = (s[k] || 0) + w[k];
    });
    return s;
  }, [answers]);

  const results = useMemo(() => {
    const ranked = CAREERS.map(c => ({ ...c, score: similarity(scores, c.v) })).sort((a, b) => b.score - a.score);
    return ranked.slice(0, 3);
  }, [scores, stage]);

  const topAxes = useMemo(() => {
    return [...AXES].sort((a, b) => scores[b] - scores[a]).slice(0, 3);
  }, [scores, stage]);

  const maxAxisScore = Math.max(1, ...AXES.map(a => scores[a]));

  const start = async () => {
    await sound.ensure();
    setStage("quiz");
  };

  const selectOption = (optIdx) => {
    sound.tick();
    setAnswers(prev => {
      const next = [...prev];
      next[qIndex] = optIdx;
      return next;
    });
    const nextIndex = qIndex + 1;
    if (nextIndex % 4 === 0 && nextIndex < totalQ) {
      setJustCompletedPillar(PILLARS[pillarOfIndex(qIndex)]);
      setStage("interstitial");
      setTimeout(() => {
        setQIndex(nextIndex);
        setStage("quiz");
      }, 1300);
    } else if (nextIndex >= totalQ) {
      setQIndex(nextIndex);
      setStage("loading");
      sound.chime();
      setTimeout(() => setStage("result"), 2200);
    } else {
      setQIndex(nextIndex);
    }
  };

  const goBack = () => {
    if (qIndex === 0) return;
    sound.tick();
    setQIndex(qIndex - 1);
  };

  const restart = () => {
    setAnswers(Array(QUESTIONS.length).fill(null));
    setQIndex(0);
    setStage("intro");
  };

  const copyResult = async () => {
    const top = results[0];
    const text = `Meu Ikigai apontou: ${top.name} ${top.emoji}\n${top.desc}\nTraços dominantes: ${topAxes.map(a => AXIS_LABEL[a]).join(", ")}.`;
    try { await navigator.clipboard.writeText(text); } catch (e) {}
  };

  const q = QUESTIONS[qIndex];
  const pillar = q ? PILLARS[pillarOfIndex(qIndex)] : null;
  const qInPillar = qIndex % 4;

  return (
    <div style={styles.page}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
        * { box-sizing: border-box; }
        @keyframes fadeUp { from { opacity:0; transform: translateY(14px);} to { opacity:1; transform: translateY(0);} }
        @keyframes stampIn { from { opacity:0; transform: scale(1.5) rotate(-6deg);} to { opacity:1; transform: scale(1) rotate(-4deg);} }
        @keyframes pulseRing { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }
        @keyframes floatSlow { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-6px);} }
        .fade-up { animation: fadeUp 0.45s ease both; }
        .opt-btn { transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
        .opt-btn:active { transform: scale(0.97); }
        .opt-btn:hover { border-color: #201D18; box-shadow: 0 4px 0 0 #201D18; }
        .primary-btn { transition: transform .15s ease; }
        .primary-btn:active { transform: scale(0.96); }
      `}</style>

      <div style={styles.card}>
        {stage === "intro" && (
          <div className="fade-up" style={{ textAlign: "center" }}>
            <div style={{ animation: "floatSlow 4s ease-in-out infinite" }}>
              <IkigaiDiagram revealed={[true, true, true, true]} size={190} />
            </div>
            <div style={styles.eyebrow}>生き甲斐 · uma jornada de 16 perguntas</div>
            <h1 style={styles.h1}>Ikigai</h1>
            <p style={styles.p}>
              Quatro círculos. Quatro perguntas sobre você. No centro deles mora a razão
              pela qual você acorda de manhã — e um caminho de carreira que combina com ela.
            </p>
            <button className="primary-btn" style={styles.primaryBtn} onClick={start}>
              Começar minha jornada
            </button>
            <div style={styles.pillarLegend}>
              {PILLARS.map(p => (
                <div key={p.key} style={styles.legendItem}>
                  <span style={{ ...styles.dot, background: p.color }} />
                  {p.label}
                </div>
              ))}
            </div>
          </div>
        )}

        {stage === "quiz" && q && (
          <div key={qIndex} className="fade-up">
            <div style={styles.topRow}>
              {qIndex > 0 ? (
                <button style={styles.backBtn} onClick={goBack} aria-label="Voltar">←</button>
              ) : (
                <div style={{ width: 34 }} />
              )}
              <IkigaiDiagram revealed={revealed} size={56} />
              <div style={{ flex: 1, marginLeft: 12 }}>
                <div style={{ ...styles.pillarTag, color: pillar.color, borderColor: pillar.color }}>
                  {pillar.label} · {pillar.sub}
                </div>
                <div style={styles.progressTrack}>
                  <div style={{ ...styles.progressFill, width: `${((qIndex) / totalQ) * 100}%`, background: pillar.color }} />
                </div>
                <div style={styles.progressLabel}>Pergunta {qInPillar + 1} de 4 · nesta etapa</div>
              </div>
            </div>

            <h2 style={styles.question}>{q.text}</h2>

            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 18 }}>
              {q.options.map((opt, i) => (
                <button
                  key={i}
                  className="opt-btn"
                  style={answers[qIndex] === i ? styles.optBtnSelected : styles.optBtn}
                  onClick={() => selectOption(i)}
                >
                  {opt.label}
                </button>
              ))}
            </div>
          </div>
        )}

        {stage === "interstitial" && justCompletedPillar && (
          <div className="fade-up" style={{ textAlign: "center", padding: "40px 0" }}>
            <div style={{ fontSize: 44, animation: "pulseRing 1.1s ease-in-out infinite" }}>◎</div>
            <div style={{ ...styles.eyebrow, color: justCompletedPillar.color }}>etapa concluída</div>
            <h2 style={{ ...styles.h1, fontSize: 28, color: justCompletedPillar.color }}>
              {justCompletedPillar.label} mapeado ✓
            </h2>
            <p style={styles.p}>Seguindo para a próxima peça do seu Ikigai...</p>
          </div>
        )}

        {stage === "loading" && (
          <div className="fade-up" style={{ textAlign: "center", padding: "30px 0" }}>
            <div style={{ animation: "pulseRing 1s ease-in-out infinite" }}>
              <IkigaiDiagram revealed={[true, true, true, true]} size={190} />
            </div>
            <p style={{ ...styles.p, marginTop: 18 }}>Calculando seu Ikigai...</p>
          </div>
        )}

        {stage === "result" && results.length > 0 && (
          <div className="fade-up" style={{ textAlign: "center" }}>
            <div style={styles.eyebrow}>seu ikigai revelou</div>
            <IkigaiDiagram revealed={[true, true, true, true]} size={190} showStamp stampText={results[0].name} />
            <div style={{ fontSize: 40, marginTop: 6 }}>{results[0].emoji}</div>
            <h1 style={styles.h1}>{results[0].name}</h1>
            <p style={styles.p}>{results[0].desc}</p>

            <div style={styles.badgeRow}>
              {topAxes.map(a => (
                <span key={a} style={styles.badge}>{AXIS_LABEL[a]}</span>
              ))}
            </div>

            <div style={{ textAlign: "left", margin: "22px 0" }}>
              {AXES.filter(a => scores[a] > 0).sort((a,b)=>scores[b]-scores[a]).slice(0,5).map(a => (
                <div key={a} style={{ marginBottom: 8 }}>
                  <div style={styles.barLabel}>{AXIS_LABEL[a]}</div>
                  <div style={styles.barTrack}>
                    <div style={{ ...styles.barFill, width: `${(scores[a]/maxAxisScore)*100}%` }} />
                  </div>
                </div>
              ))}
            </div>

            <div style={{ borderTop: "1px dashed #C9BCA2", margin: "20px 0", paddingTop: 18 }}>
              <div style={styles.eyebrow}>outros caminhos que também combinam</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 10 }}>
                {results.slice(1).map(r => (
                  <div key={r.name} style={styles.altCard}>
                    <span style={{ fontSize: 22, marginRight: 10 }}>{r.emoji}</span>
                    <div style={{ textAlign: "left" }}>
                      <div style={{ fontWeight: 700 }}>{r.name}</div>
                      <div style={{ fontSize: 13, color: "#5A5346" }}>{r.desc}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <button className="primary-btn" style={styles.primaryBtn} onClick={restart}>
              Refazer a jornada
            </button>
            <button className="primary-btn" style={styles.secondaryBtn} onClick={copyResult}>
              Copiar resultado
            </button>
          </div>
        )}
      </div>
    </div>
  );
}
